description: 'Alkane Resources Ltd (ASX: ALK, TSX: ALK, OTCQX: ALKRY) is an Australian gold and antimony producer headquartered in West
  Perth, Western Australia, operating three mines: the Tomingley gold mine in Central West New South Wales, the Costerfield gold-antimony
  operation in Central Victoria and the Björkdal gold mine in Sweden (the latter two added by its August 2025 merger with Mandalay Resources),
  and holding the Boda-Kaiser gold-copper project in New South Wales. Its site alkres.com publishes corporate, management, investor
  news, privacy and terms pages; no public developer API, documentation or developer portal was found.'

